<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{% endblock %} · Exodus Contable</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/exodus.css') }}">
</head>
<body>
  {% if usuario %}
  <header class="topbar">
    <div class="topbar-brand">
      <img src="{{ url_for('static', filename='logo.png') }}" alt="Exodus Contable" class="topbar-logo">
      <a class="wordmark" href="{{ url_for('inicio') }}">Exodus Contable</a>
    </div>
    <form class="topbar-search" role="search" aria-label="Búsqueda en Exodus Contable">
      <label for="busqueda" class="visually-hidden">Buscar</label>
      <input type="search" id="busqueda" name="q" placeholder="Buscar..." autocomplete="off">
      <button type="submit" class="btn-search" aria-label="Buscar">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      </button>
    </form>
    <div class="topbar-user">
      <span class="who">
        <strong>{{ usuario['nombre'] }}</strong>
        <span>{{ roles[usuario['rol']] }}</span>
      </span>
      <form method="post" action="{{ url_for('salir') }}">
        <input type="hidden" name="csrf" value="{{ csrf_token() }}">
        <button class="btn btn-quiet" type="submit">Cerrar sesión</button>
      </form>
    </div>
  </header>
  {% endif %}
  {% block body %}{% endblock %}
</body>
</html>
