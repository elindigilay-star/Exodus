<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{% endblock %} · Exodus Contable</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/exodus.css') }}">
</head>
<body>
  {% if usuario %}
  <header class="topbar">
    <a class="wordmark" href="{{ url_for('inicio') }}">Exodus Contable</a>
    <div class="topbar-user">
      <span class="who">
        <strong>{{ usuario['nombre'] }}</strong>
        <span>{{ roles[usuario['rol']] }}</span>
      </span>
      <form method="post" action="{{ url_for('salir') }}">
        <input type="hidden" name="csrf" value="{{ csrf_token() }}">
        <button class="btn btn-quiet" type="submit">Cerrar sesión</button>
      </form>
    </div>
  </header>
  {% endif %}
  {% block body %}{% endblock %}
</body>
</html>
